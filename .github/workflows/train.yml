name: Model Training Pipeline

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '50'
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  train:
    name: Train Model
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download dataset
        run: |
          echo "📥 Downloading dataset..."
          # Add your dataset download logic here
          # Example: wget, curl, or cloud storage download
      
      - name: Train model
        run: |
          python main.py --epochs ${{ github.event.inputs.epochs || 50 }}
      
      - name: Upload trained model
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: outputs/best_model.pth
      
      - name: Upload training logs
        uses: actions/upload-artifact@v3
        with:
          name: training-logs
          path: logs/
      
      - name: Generate training report
        run: |
          echo "📊 Training completed successfully"
          echo "Model saved to outputs/best_model.pth"
