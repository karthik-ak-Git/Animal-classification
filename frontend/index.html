<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Classifier</title>
    <!-- favicon -->
    <link rel="icon" href="frontend/favicon.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="frontend/style.css">
</head>

<body>

    <div class="app-container">
        <!-- Header  -->
        <header class="app-header">
            <div class="container">
                <div class="header-content">
                    <h1 class="app-title">
                        <span class="title-icon">🐾</span>
                        Animal Classifier
                    </h1>
                    <p class="app-subtitle">AI-Powered animal and breed prediction or identification</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <div class="container">
                <!-- Upload section -->
                <section class="upload-section">
                    <div class="upload-card">
                        <div class="upload-area" id="upload-area">
                            <div class="upload-content">
                                <div class="upload-icon">
                                    <i class="bi bi-cloud-upload"></i>
                                </div>
                                <h3 class="upload-title">Upload an image</h3>
                                <p class="upload-description">Drag and drop or click to select image</p>
                                <input type="file" id="image-upload" class="form-control d-none" accept="image/*">
                                <button class="btn btn-primary bth-upload"
                                    onclick="document.getElementById('image-upload').click()">
                                    <i class="bi bi-upload me-2"></i>Choose Image
                                </button>
                            </div>
                        </div>

                        <!-- image Preview -->
                        <div id="image-preview-container" class="image-preview-container d-none">
                            <div class="preview-wrapper">
                                <img alt="Preview" class="image-preview" id="image-preview">
                                <button class="btn btn-remove" onclick="removerimage()" title="Remove image">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>

</body>

</html>
