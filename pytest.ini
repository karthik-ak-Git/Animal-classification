[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-config=.coveragerc

# Coverage options
[coverage:run]
omit =
    tests/*
    venv/*
    __pycache__/*
    */migrations/*
    */tests/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
