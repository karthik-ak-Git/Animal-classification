services:
  - type: web
    name: animal-classification-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 8000
      - key: SKLEARN_SKIP_NETWORK_TESTS
        value: 1
      - key: SKLEARN_SKIP_PYTEST_COLLECT
        value: 1
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: NUMEXPR_NUM_THREADS
        value: 1
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONDONTWRITEBYTECODE
        value: 1
      - key: TORCH_NUM_THREADS
        value: 1
      - key: TORCH_CUDNN_V8_API_ENABLED
        value: 0
      - key: TORCH_USE_CUDA_DSA
        value: 0
      - key: PYTORCH_CUDA_ALLOC_CONF
        value: max_split_size_mb:128
    healthCheckPath: /health
    healthCheckTimeout: 300
    autoDeploy: true
